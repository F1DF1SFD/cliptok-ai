# Builds the read-only demo (no backend) and publishes it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The site lands at https://<user>.github.io/<repo>/ — or at the root when the repo
# is named <user>.github.io. NEXT_PUBLIC_BASE_PATH below handles that difference,
# so both work without editing anything.
name: Deploy demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Work out the base path
        id: base
        shell: bash
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the static demo
        working-directory: frontend
        env:
          NEXT_PUBLIC_DEMO_MODE: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      # Pages skips Jekyll for artifact deploys, but the file costs nothing and
      # keeps the export working if it is ever served from a branch instead.
      - name: Disable Jekyll
        working-directory: frontend
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
